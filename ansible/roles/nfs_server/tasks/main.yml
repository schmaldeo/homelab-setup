---
- name: Install NFS server packages
  ansible.builtin.package:
    name: "{{ nfs_server_packages[ansible_facts['os_family']] }}"
    state: present

- name: Create NFS share directory
  ansible.builtin.file:
    path: "{{ backup_mount_dir }}"
    state: directory
    mode: "0770"
    owner: root
    group: root

- name: Configure NFS export
  ansible.builtin.lineinfile:
    path: /etc/exports
    line: >-
      {{ backup_mount_dir }}
      {{ nfs_allowed_network }}(rw,sync,no_subtree_check)
    create: true
    mode: "0644"
  notify: Reload NFS exports

- name: Mount backup disk
  ansible.posix.mount:
    path: "{{ backup_mount_dir }}"
    src: "LABEL={{ backup_disk_label }}"
    fstype: ext4
    opts: "defaults,nofail,x-systemd.automount"
    state: mounted

- name: Enable and start NFS server
  ansible.builtin.systemd_service:
    name: "{{ nfs_server_services[ansible_facts['os_family']] }}"
    enabled: true
    state: started
