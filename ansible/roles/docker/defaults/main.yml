---
docker_user: docker
docker_workdir: "/home/docker/dimgs"
docker_user_password_hash: "{{ docker_user_pw }}"
docker_debian_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_fedora_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_custom_aliases:
  - "alias ds='docker ps -a'"
docker_custom_functions:
  - |
    dp() {
      docker exec -it "$1" /bin/bash
    }
  - |
    dpsh() {
      docker exec -it "$1" /bin/sh
    }
