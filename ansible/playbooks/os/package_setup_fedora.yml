---
- name: Install system packages (Fedora)
  hosts: fedora
  become: true

  tasks:
    - name: Install required packages
      ansible.builtin.dnf:
        pkg:
          - acl
          - git
          - parted
        state: present

- name: Install backup packages (Fedora)
  hosts: fedora:&backups
  become: true

  tasks:
    - name: Install restic
      ansible.builtin.dnf:
        name: restic
        state: present

- name: Install Docker (Fedora)
  hosts: fedora
  become: true

  tasks:
    - name: Add Docker repository
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/fedora/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: '0644'

    - name: Refresh dnf metadata
      ansible.builtin.dnf:
        update_cache: true

    - name: Install Docker packages
      ansible.builtin.dnf:
        pkg:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Verify Docker is running
      ansible.builtin.systemd_service:
        state: started
        name: docker
