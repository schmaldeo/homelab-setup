all:
  hosts:
    debian_vm:
      ansible_host: 192.168.0.80
  vars:
    ansible_user: ansible
    ansible_become_user: root
    ntfy_topic: fake_topic
    repo_root: "{{ inventory_dir }}/.."
    docker_workdir: "/home/docker/dimgs"
    backup_mount_dir: "/mnt/extdrive"
    backup_disk_label: "BACKUP"


deploy:
  hosts:
    debian_vm:

backups:
  hosts:
    debian_vm:
  vars:
    backup_dest: "{{ nfs_dir }}/backup.img"

pihole:
  hosts:
    debian_vm:
  vars:
    pihole_pw: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      
    

debian:
  hosts:
    debian_vm:
