---
# Taken from official pi-hole repo and adapted slightly setup
services:
  pihole:
    image: pihole/pihole:2026.07.2
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Default HTTP Port
      - "80:80/tcp"
      # Default HTTPs Port. FTL will generate a self-signed certificate
      - "443:443/tcp"
      # Uncomment the line below if you are using Pi-hole as your DHCP server
      # - "67:67/udp"
    environment:
      TZ: 'Europe/Warsaw'
      FTLCONF_webserver_api_password: ${WEB_PASSWORD:?WEB_PASSWORD must be set}
      # If using Docker's default `bridge` network setting 
      # the dns listening mode should be set to 'ALL'
      FTLCONF_dns_listeningMode: 'ALL'
    volumes:
      - './etc:/etc/pihole'
    # cap_add:
      # See https://docs.pi-hole.net/docker/#note-on-capabilities
      # - NET_ADMIN
      # - SYS_TIME
      # - SYS_NICE
    restart: unless-stopped