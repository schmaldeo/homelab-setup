services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # TODO zmienna środowiskowa
      - /opt/homelab/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    restart: always

  node-exporter:
    image: prom/node-exporter:latest
    pid: host
    volumes:
      - /:/host:ro
    command:
      - '--path.rootfs=/host'
    restart: always

  wireguard-exporter:
    image: mindflavor/prometheus-wireguard-exporter:latest
    network_mode: "host"
    cap_add:
      - NET_ADMIN
    restart: always
