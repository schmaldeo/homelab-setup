name: Validate Code
on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linters
        run: pip install yamllint flake8

      - name: Run yamllint
        run: yamllint .

      - name: Run flake8
        run: flake8 .