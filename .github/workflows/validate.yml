---
name: Validate Code
"on":
  push:
  pull_request:
    branches: ["release"]


jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core ansible-lint yamllint

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

      - name: Check Ansible playbook syntax
        run: >
          ansible-playbook
          -i ansible/inventories/homelab/hosts.yml
          --syntax-check
          ansible/playbooks/site.yml

      - name: Validate Docker Compose configuration
        env:
          WEB_PASSWORD: ci-validation-password
        run: |
          ansible localhost -c local -m ansible.builtin.template \
            -a "src=ansible/roles/pihole/templates/compose.yml.j2 \
            dest=/tmp/pihole-compose.yml" \
            -e pihole_image=pihole/pihole:2026.07.2 \
            -e pihole_timezone=UTC
          docker compose -f /tmp/pihole-compose.yml config --quiet
          ansible localhost -c local -m ansible.builtin.template \
            -a "src=ansible/roles/monitoring/templates/compose.yml.j2 \
            dest=/tmp/monitoring-compose.yml" \
            -e monitoring_prometheus_image=prom/prometheus:v3.5.0 \
            -e monitoring_prometheus_port=19090 \
            -e monitoring_grafana_image=grafana/grafana:12.1.1 \
            -e monitoring_node_exporter_image=prom/node-exporter:v1.9.1
          docker compose -f /tmp/monitoring-compose.yml config --quiet
          ansible localhost -c local -m ansible.builtin.template \
            -a "src=ansible/roles/wg_easy/templates/compose.yml.j2 \
            dest=/tmp/wg-easy-compose.yml" \
            -e wg_easy_host=192.0.2.1 \
            -e wg_easy_image=ghcr.io/wg-easy/wg-easy:15 \
            -e wg_easy_wireguard_port=51820 \
            -e wg_easy_host=192.0.2.1 \
            -e wg_easy_panel_port=51821 \
            -e wg_easy_caddy_image=caddy:2.10.0-alpine
          docker compose -f /tmp/wg-easy-compose.yml config --quiet

