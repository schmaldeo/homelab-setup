---
name: Validate Code
on:
  push:
  pull_request:
    branches: ["release"]


jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core ansible-lint yamllint

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

      - name: Check Ansible playbook syntax
        run: >
          ansible-playbook
          -i ansible/inventories/homelab/hosts.yml
          --syntax-check
          ansible/playbooks/common-install.yml

      - name: Validate Docker Compose configuration
        env:
          WEB_PASSWORD: ci-validation-password
        run: docker compose -f docker/pi-hole/compose.yml config --quiet

      - name: Run ShellCheck
        run: shellcheck scripts/**/*.sh
